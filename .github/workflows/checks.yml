name: Release Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '11.25.0'
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and run local regression checks
        run: node scripts/release-check.mjs

  mobile-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '11.25.0'
          run_install: false
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir mobile install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build mobile preview without local auth configuration
        run: pnpm --dir mobile build
      - name: Run mobile regressions
        run: |
          pnpm --dir mobile test
          pnpm --dir mobile test:ui
          pnpm --dir mobile test:checkin
          pnpm --dir mobile test:accounts
          pnpm --dir mobile test:onboarding
          pnpm --dir mobile test:sync
          pnpm --dir mobile test:settings
          pnpm --dir mobile test:backup
          pnpm --dir mobile test:reports
          pnpm --dir mobile test:accessibility
          pnpm --dir mobile test:policies
      - name: Build and verify candidate web payload without local auth configuration
        run: |
          pnpm --dir mobile build:candidate
          pnpm --dir mobile test:candidate
