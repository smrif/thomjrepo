<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 305" role="img" aria-labelledby="title">
  <title id="title">Whose Day home illustration</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEEE6"/>
      <stop offset="100%" stop-color="#F8F1E4"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9D9A1"/>
      <stop offset="100%" stop-color="#E0917E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#6F8873" flood-opacity=".16"/>
    </filter>
    <style>
      @media (prefers-color-scheme: dark){
        .sky{fill:#262E3B}
        .star{fill:#9EBBA1;opacity:.75}
        .hill{fill:#6F8873}
        .house{fill:#F2EEE7;stroke:#333D4D}
        .roof{fill:#9EBBA1}
        .door{fill:#8FA6B8}
        .moon-left{fill:#E8A392}
        .moon-right{fill:#9EBBA1}
        .moon-dot{fill:#1E2530}
        .ground-line{stroke:#9EBBA1}
      }
    </style>
  </defs>

  <rect class="sky" x="20" y="20" width="355" height="265" rx="2" fill="url(#sky)"/>

  <g class="stars" fill="#C9C2AC">
    <circle class="star" cx="80" cy="76" r="2"/>
    <circle class="star" cx="112" cy="52" r="2.4"/>
    <circle class="star" cx="62" cy="112" r="1.8"/>
    <circle class="star" cx="319" cy="93" r="2.2"/>
    <path class="star" d="M344 53l2.8 7 7 2.8-7 2.8-2.8 7-2.8-7-7-2.8 7-2.8 2.8-7Z" opacity=".8"/>
    <path class="star" d="M128 91l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" opacity=".75"/>
  </g>

  <g class="moon" transform="translate(279 72)">
    <path class="moon-left" d="M0-34a34 34 0 0 0 0 68V-34Z" fill="#E0917E"/>
    <path class="moon-right" d="M0-34a34 34 0 0 1 0 68V-34Z" fill="#8DA292"/>
    <circle class="moon-dot" cx="0" cy="0" r="8" fill="#FAF6F0"/>
  </g>

  <path class="hill" d="M20 243c50-19 88-22 136-7 39 12 77 14 116 3 36-10 70-7 103 6v40H20v-42Z" fill="#8DA292"/>

  <g class="home" filter="url(#softShadow)">
    <path class="roof" d="M197.5 128 256 172h-19l-39.5-29.8L158 172h-19l58.5-44Z" fill="#8DA292"/>
    <path class="house" d="M151 170 197.5 135 244 170v64h-93v-64Z" fill="#FFFDF9" stroke="#E7E0D4" stroke-width="2.5" stroke-linejoin="round"/>
    <rect class="door" x="185" y="202" width="25" height="32" rx="5" fill="#8FA6B8"/>
    <circle cx="204" cy="218" r="1.7" fill="#FAF6F0" opacity=".95"/>
    <rect x="161" y="188" width="22" height="22" rx="5" fill="url(#windowGlow)" opacity=".9"/>
    <path d="M172 189v20M162 199h20" stroke="#FFFDF9" stroke-width="2" opacity=".72"/>
  </g>

  <g class="shrubs" fill="#6F8873" opacity=".45">
    <circle cx="116" cy="231" r="13"/>
    <circle cx="134" cy="229" r="16"/>
    <circle cx="253" cy="232" r="12"/>
    <circle cx="268" cy="230" r="15"/>
  </g>

  <path class="ground-line" d="M35 262h325" fill="none" stroke="#6F8873" stroke-width="3" stroke-linecap="round" opacity=".55"/>
</svg>
